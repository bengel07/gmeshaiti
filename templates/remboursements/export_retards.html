<!-- templates/remboursements/export_retards.html -->
{% extends "base.html" %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="card shadow">
        <div class="card-header bg-danger text-white">
            <h5><i class="fas fa-exclamation-triangle me-2"></i> Export des remboursements en retard</h5>
        </div>
        <div class="card-body">
            <form method="GET" action="{{ url_for('export_remboursements_retards') }}" class="row g-3">
                <!-- Filtres -->
                <div class="col-md-3">
                    <label class="form-label">Jours de retard minimum</label>
                    <select name="jours_retard" class="form-select">
                        <option value="1">1 jour</option>
                        <option value="7">7 jours</option>
                        <option value="15">15 jours</option>
                        <option value="30" selected>30 jours</option>
                        <option value="60">60 jours</option>
                        <option value="90">90 jours</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Date début</label>
                    <input type="date" name="date_debut" class="form-control">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Date fin</label>
                    <input type="date" name="date_fin" class="form-control">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Succursale</label>
                    <select name="succursale_id" class="form-select">
                        <option value="">Toutes</option>
                        {% for succursale in succursales %}
                        <option value="{{ succursale.id }}">{{ succursale.nom }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-file-excel me-2"></i> Exporter vers Excel
                    </button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Retour
                    </a>
                </div>
            </form>

            <!-- Statistiques rapides -->
            <div class="row mt-4">
                <div class="col-md-3">
                    <div class="card bg-warning">
                        <div class="card-body text-center">
                            <h3>{{ stats.total_retards }}</h3>
                            <small>Total en retard</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-danger">
                        <div class="card-body text-center">
                            <h3>{{ stats.retard_30_jours }}</h3>
                            <small>+30 jours</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-danger text-white">
                        <div class="card-body text-center">
                            <h3>{{ stats.retard_60_jours }}</h3>
                            <small>+60 jours</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-dark text-white">
                        <div class="card-body text-center">
                            <h3>{{ stats.retard_90_jours }}</h3>
                            <small>+90 jours</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
