{% extends "base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 40px; background: white; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08);">
    <h1 style="color: #0f172a; font-size: 32px; margin-bottom: 10px;">📊 Simulateur de prêt</h1>
    <p style="color: #64748b; margin-bottom: 30px;">Estimez votre capacité d'emprunt en quelques secondes</p>

    <form method="POST" action="{{ url_for('simulation_pret') }}">
        <div style="margin-bottom: 20px;">
            <label style="display: block; color: #1e293b; font-weight: 600; margin-bottom: 8px;">Montant souhaité (HTG)</label>
            <input type="number" name="montant" placeholder="Ex: 5000" style="width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; color: #1e293b; font-weight: 600; margin-bottom: 8px;">Durée (mois)</label>
            <select name="duree" style="width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px;">
                <option value="6">6 mois</option>
                <option value="12">12 mois</option>
                <option value="24">24 mois</option>
                <option value="36">36 mois</option>
            </select>
        </div>

        <button type="submit" style="
            width: 100%;
            background: #0d9488;
            color: white;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        " onmouseover="this.style.background='#0f766e'" onmouseout="this.style.background='#0d9488'">
            💳 Simuler mon prêt
        </button>
    </form>
</div>
{% endblock %}
