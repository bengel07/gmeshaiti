
workflows:
  gmes-ios:
    name: GMES iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Verify Flutter project
        script: |
          cd mobile/build/flutter
          test -f pubspec.yaml
          test -f lib/main.dart
          flutter pub get
      - name: Build iOS simulator app
        script: |
          cd mobile/build/flutter
          flutter build ios --simulator --debug
    artifacts:
      - mobile/build/flutter/build/ios/iphonesimulator/*.app
