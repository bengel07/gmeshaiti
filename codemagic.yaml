
workflows:
  gmes-ios:
    name: GMES iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Vérifier le projet Flutter
        script: |
          cd mobile/build/flutter
          flutter --version
          test -f pubspec.yaml
          grep -n -A 8 -B 3 "serious_python" pubspec.yaml
          flutter pub get

      - name: Build iOS Simulator
        script: |
          cd mobile/build/flutter
          flet --version
          flet build ios-simulator -v

    artifacts:
      - mobile/build/flutter/build/**/*.app
