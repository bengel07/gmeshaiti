
workflows:
  gmes-ios:
    name: GMES iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.gmeshaiti.mobile
      vars:
        FLUTTER_PROJECT_PATH: mobile/build/flutter
      flutter: stable
    scripts:
      - name: Check Flutter project
        script: |
          cd "$FLUTTER_PROJECT_PATH"
          test -f pubspec.yaml
          test -f lib/main.dart
          flutter pub get
      - name: Build iOS
        script: |
          cd "$FLUTTER_PROJECT_PATH"
          flutter build ios --release --no-codesign
    artifacts:
      - mobile/build/flutter/build/ios/iphoneos/*.app
