
workflows:
  gmes-ios:
    name: GMES iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      python: "3.12"

    scripts:
      - name: Installer Flet
        script: |
          python3 -m pip install --upgrade pip
          python3 -m pip install flet
          flet --version

      - name: Vérifier le projet
        script: |
          cd mobile
          test -f pubspec.yaml || exit 1
          python3 --version
          flutter --version
          flutter pub get

      - name: Build iOS Simulator
        script: |
          cd mobile
          flet build ios-simulator -v

    artifacts:
      - mobile/build/**/*.app
