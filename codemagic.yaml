
workflows:
  gmes-ios:
    name: GMES iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Verify Flutter project
        script: |
          cd mobile/build/flutter
          test -f pubspec.yaml
          test -f lib/main.dart
          flutter pub get
      - name: Build unsigned iOS app
        script: |
          cd mobile/build/flutter
          flutter build ios --release --no-codesign
    artifacts:
      - mobile/build/flutter/build/ios/iphoneos/*.app
