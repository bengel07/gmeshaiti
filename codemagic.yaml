workflows:
  gmes-ios:
    name: GMES iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      python: 3.12
    scripts:
      - name: Installer Flet
        script: |
          python3 -m pip install "flet==VERSION"
      - name: Build iOS simulator app
        script: |
          cd mobile
          flet build ios-simulator -v
    artifacts:
      - mobile/build/**/*.app